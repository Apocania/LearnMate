services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: learnmate-postgres
    environment:
      POSTGRES_DB: learnmate
      POSTGRES_USER: learnmate
      POSTGRES_PASSWORD: learnmate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: learnmate-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: learnmate-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ../apps/api
    container_name: learnmate-api
    env_file:
      - ../apps/api/.env
    depends_on:
      - postgres
      - redis
      - minio
    ports:
      - "8000:8000"

  web:
    build:
      context: ../apps/web
    container_name: learnmate-web
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  postgres_data:
  redis_data:
  minio_data:
